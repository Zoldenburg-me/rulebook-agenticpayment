packages:
  - "agent/signer"
  - "agent/mcp"
  - "rails/monerium"
  - "rails/paypal"
  - "relayer"
  - "seller"
  - "supplier"
  - "scamcheck"
  - "scripts/owner/*"
  - "dashboard"
  - "demo"
  # spikes/ is throwaway and never imported, so it stays out of the workspace.
# esbuild (via tsx, which runs the scamcheck tests) needs its install script to set up its binary.
allowBuilds:
  esbuild: true
# Runs the root smoke test under `pnpm -r test` too.
includeWorkspaceRoot: true
minimumReleaseAgeExclude:
  - "@x402/core@2.30.0"
  - "@x402/evm@2.30.0"
  - "@x402/express@2.30.0"
  - "@x402/extensions@2.30.0"
  - "@x402/fetch@2.30.0"
