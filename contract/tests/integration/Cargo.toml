[package]
name = "mandate-integration"
version = "0.1.0"
edition = "2021"
publish = false

# T1 integration harness: the mandate contract and a mock v1.signer in a near-workspaces
# sandbox. Its own workspace, not a member of the root one, so the root `cargo test` does not
# pull near-workspaces or need the sandbox binary. Run it with
#   cargo test --manifest-path contract/tests/integration/Cargo.toml
[workspace]
members = ["mock_signer"]

[dependencies]
mandate = { path = "../.." }
# unit-testing: the host build of `mandate` needs it (near-sdk's compile_error! otherwise).
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
# Software passkey (owner) and the mock MPC's secp256k1 key.
p256 = { version = "0.13", features = ["ecdsa"] }
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
