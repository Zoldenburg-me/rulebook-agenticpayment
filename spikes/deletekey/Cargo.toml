[package]
name = "deletekey-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone spike: not a member of any root workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

